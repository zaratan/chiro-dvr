<!doctype html><meta charset="utf-8"><title>347 encode</title><body><a id="save">save</a><script type="module">
window.run = (options) => new Promise((resolve, reject) => {
  const worker = new Worker("encode.js", { type: "module" });
  worker.onmessage = (event) => {
    if (event.data.file) { const link = document.getElementById("save"); link.href = URL.createObjectURL(new Blob([event.data.file], { type: "video/mp4" })); link.download = "piste_01_0m07s.mp4"; }
    else if (event.data.done) resolve(event.data); else if (event.data.error) reject(new Error(event.data.error));
  };
  worker.onerror = (event) => reject(new Error(event.message));
  worker.postMessage(options);
});
</script>
