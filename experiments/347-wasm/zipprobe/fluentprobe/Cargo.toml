[package]
name = "fluentprobe"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
fluent-bundle = "0.16.0"
unic-langid = { version = "0.9.6", features = ["macros"] }
jiff = { version = "0.2.38", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
