[tools]
python = "3.14.8"
lefthook = "2.1.16"
"github:taiki-e/cargo-llvm-cov" = "0.9.1"
cargo-deny = "0.20.2"
"github:Boshen/cargo-shear" = "1.14.0"
"github:EmbarkStudios/cargo-about" = "0.9.2"

[tasks.check]
run = [
  { task = "rust:static" },
  { task = "rust:test" },
]

[tasks."check:ci"]
run = [
  { task = "rust:coverage" },
  { task = "rust:slow" },
  { task = "rust:settings" },
]

[tasks.package]
depends = ["rust:link"]
run = "bash packaging/package.sh"

[tasks."package:check"]
depends = ["package"]
run = 'bash packaging/check.sh "$(bash packaging/package.sh --archive)" "$(bash packaging/package.sh --version)"'

[tasks.notice]
depends = ["rust:link"]
run = '''
python3 -I - <<'EOF'
import json
import subprocess
import tomllib

ABOUT = "packaging/about.toml"
NOTICE = "packaging/NOTICE"
CRATES = "packaging/licenses/crates.txt"
HEADER = "Rust crates:"
PLACEHOLDER = "Copyright (c) <year> <copyright holders>"

def output(command):
    return subprocess.run(command, check=True, capture_output=True, text=True).stdout

targets = tomllib.load(open(ABOUT, "rb"))["targets"]
tree = output(["cargo", "tree", "--locked", "-p", "batdetect", "-e", "normal,no-proc-macro",
               "--prefix", "none", "--format", "{p}", *[flag for target in targets for flag in ("--target", target)]])
shipped = {tuple(line.removesuffix(" (*)").split(" ")[:2]) for line in tree.splitlines() if line and "(" not in line}
shipped = {(name, version.removeprefix("v")) for name, version in shipped}

about = json.loads(output(["cargo", "about", "generate", "--locked", "--fail", "-c", ABOUT,
                           "-m", "crates/cli/Cargo.toml", "--format", "json"]))
chosen = {}
merged = {}
for license in about["licenses"]:
    users = sorted({(use["crate"]["name"], use["crate"]["version"]) for use in license["used_by"]} & shipped)
    if users:
        text = license["text"].replace("\r\n", "\n").strip()
        if PLACEHOLDER in text:
            authors = sorted({author for use in license["used_by"] for author in use["crate"]["authors"]})
            text = text.replace(PLACEHOLDER, f"No copyright notice is published with these crates. Authors: {', '.join(authors) or 'not declared'}.")
        if "<year>" in text or "<copyright holders>" in text:
            raise SystemExit(f"notice: template text for {users}")
        key = (license["id"], " ".join(text.split()))
        if key in merged:
            merged[key][1].extend(users)
        else:
            merged[key] = [license["id"], users, text]
        for user in users:
            chosen.setdefault(user, set()).add(license["id"])
texts = [(identifier, sorted(set(users)), text) for identifier, users, text in merged.values()]
missing = sorted(shipped - set(chosen))
if missing:
    raise SystemExit(f"notice: no license text for {missing}")

lines = [f"- {name} {version}, {' AND '.join(sorted(chosen[(name, version)]))}" for name, version in sorted(shipped)]
notice = open(NOTICE, encoding="utf-8").read().split("\n")
start = notice.index(HEADER)
end = next((index for index in range(start + 1, len(notice)) if not notice[index].strip()), len(notice))
rest = notice[end:] if end < len(notice) else [""]
open(NOTICE, "w", encoding="utf-8").write("\n".join(notice[:start + 1] + lines + rest))

texts.sort(key=lambda entry: (entry[0], entry[1]))
blocks = [f"{identifier}: {', '.join(f'{name} {version}' for name, version in users)}\n\n{text}\n"
          for identifier, users, text in texts]
open(CRATES, "w", encoding="utf-8").write(("\n" + "=" * 80 + "\n\n").join(blocks))
print(f"notice: {len(shipped)} crates, {len(texts)} license texts")
EOF
'''

[tasks."rust:ffmpeg"]
run = "bash packaging/ffmpeg-unix.sh"

[tasks."rust:link"]
run = "bash packaging/ffmpeg-unix.sh --link"

[tasks."rust:static"]
depends = ["rust:link"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  { task = "rust:rules" },
  "cargo deny check",
  "cargo shear --deny-warnings",
]

[tasks."rust:rules"]
run = '''
python3 -I - <<'EOF'
import glob
import re
import sys
import tomllib

failures = []
sources = {path: open(path, encoding="utf-8").read() for path in glob.glob("crates/**/*.rs", recursive=True)}
manifests = {path: tomllib.load(open(path, "rb")) for path in glob.glob("crates/*/Cargo.toml")}

def lines_matching(pattern, files, flags=0):
    return [f"{path}:{text.count(chr(10), 0, found.start()) + 1}" for path, text in files.items()
            for found in re.finditer(pattern, text, flags)]

attribute = r"#!?\[\s*(allow|expect)\b|cfg_attr\s*\((?:[^()]|\([^()]*\))*?\b(allow|expect)\b"
for found in lines_matching(attribute, sources):
    failures.append(f"C4 allow or expect attribute: {found}")

workspace = tomllib.load(open("Cargo.toml", "rb"))
expected = {table: dict(lints) for table, lints in workspace["workspace"]["lints"].items()}
expected["rust"].pop("unsafe_code", None)
for path, manifest in manifests.items():
    lints = manifest.get("lints")
    if path == "crates/media/Cargo.toml":
        if lints != expected:
            failures.append(f"C6 {path}: lints differ from the workspace table without unsafe_code")
    elif lints != {"workspace": True}:
        failures.append(f"C5 {path}: lints must be `workspace = true`")
    scopes = [manifest, *manifest.get("target", {}).values()]
    for scope, table in ((scope, table) for scope in scopes for table in ("dependencies", "dev-dependencies", "build-dependencies")):
        for name, spec in scope.get(table, {}).items():
            if not (isinstance(spec, dict) and spec.get("workspace") is True) or {"version", "path", "git"} & set(spec):
                failures.append(f"C8 {path}: {name} must come from the workspace")

outside_media = {path: text for path, text in sources.items() if not path.startswith("crates/media/")}
outside_media |= {path: open(path).read() for path in manifests if not path.startswith("crates/media/")}
for found in lines_matching(r"ffmpeg[_-](next|sys[_-]next)", outside_media):
    failures.append(f"C7 FFmpeg outside media: {found}")

def tested(path):
    return path.endswith(("/tests.rs", "/testing.rs")) or "/tests/" in path

shipped = {path: text for path, text in sources.items() if not tested(path)}
unwinds = lines_matching(r"^(?!\s*(?:pub\s+)?use\b).*\bcatch_unwind\b", shipped, re.MULTILINE)
if len(unwinds) > 1 or any(not found.startswith("crates/cli/src/") for found in unwinds):
    failures.append(f"C9 catch_unwind outside the one in crates/cli/src: {unwinds}")
profiles = workspace.get("profile", {}).values()
if any(profile.get("panic") == "abort" for profile in profiles):
    failures.append("C9 a profile aborts on panic")

code = [line for text in sources.values() for line in text.splitlines() if line.strip()]
comments = [line for line in code if re.search(r"(?<![:\"])//|/\*(?!/)", line)]
if code and len(comments) > 0.02 * len(code):
    failures.append(f"C10 {len(comments)} comment lines out of {len(code)}, above 2 %")

for found in lines_matching(r"round_ties_even|opencv|numpy|python|pairwise", sources, re.IGNORECASE):
    failures.append(f"C11 imitation: {found}")

for failure in failures:
    print(failure, file=sys.stderr)
sys.exit(1 if failures else 0)
EOF
'''

[tasks."rust:coverage"]
depends = ["rust:link"]
run = "cargo llvm-cov --profile ci --workspace --locked --fail-under-lines 95"

[tasks."rust:test"]
depends = ["rust:link"]
run = "cargo test --workspace --locked --profile ci"

[tasks."rust:slow"]
depends = ["rust:link"]
run = "cargo test --workspace --locked --profile ci --test 'slow_*' -- --include-ignored"

[tasks."rust:settings"]
depends = ["rust:link"]
run = "cargo test --workspace --locked --profile ci --test 'settings_*' -- --include-ignored"

[tasks."rust:reference"]
depends = ["rust:link"]
run = "cargo test --workspace --locked --profile ci --test 'reference_*' -- --include-ignored"

[tasks."rust:data"]
shell = "bash -c"
env = { REMOTE = "chiro-dvr:chiro-dvr-videos", SUMS = "tests/fixtures/reference/SHA256SUMS" }
run = '''
set -euo pipefail
fail() { echo "rust:data: $*" >&2; exit 1; }
for tool in rclone shasum python3; do
  command -v "$tool" > /dev/null || fail "$tool is not installed"
done
[ -n "${BATDETECT_REFERENCE_DIR:-}" ] || fail "BATDETECT_REFERENCE_DIR is not set"
[ -n "${BATDETECT_VIDEOS_DIR:-}" ] || fail "BATDETECT_VIDEOS_DIR is not set"
checkout=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")
python3 -I - "$BATDETECT_REFERENCE_DIR" "$BATDETECT_VIDEOS_DIR" "$MISE_PROJECT_ROOT/in" "$checkout/in" "$HOME/dossier sans titre/img_0000" <<'EOF'
import os
import sys

def lineage(path):
    path = os.path.realpath(path)
    while True:
        yield path
        if os.path.dirname(path) == path:
            return
        path = os.path.dirname(path)

def same(a, b):
    return a == b or (os.path.exists(a) and os.path.exists(b) and os.path.samefile(a, b))

def overlap(a, b):
    return any(same(up, os.path.realpath(b)) for up in lineage(a)) or any(same(up, os.path.realpath(a)) for up in lineage(b))

reference, videos, *protected = sys.argv[1:]
for target in (reference, videos):
    if not os.path.isabs(target):
        sys.exit(f"rust:data: {target} is not an absolute path")
    for kept in protected:
        if overlap(target, kept):
            sys.exit(f"rust:data: {target} overlaps {kept}, which holds the user's videos")
if overlap(reference, videos):
    sys.exit("rust:data: BATDETECT_REFERENCE_DIR and BATDETECT_VIDEOS_DIR overlap")
EOF

sums="$MISE_PROJECT_ROOT/$SUMS"
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
sums_under() { grep -F "  $1/" "$sums" | sed "s|  $1/|  |" > "$work/$1.sums"; cut -c67- "$work/$1.sums" | LC_ALL=C sort > "$work/$1.known"; }
refuse_strangers() {
  local prefix=$1 dir=$2 depth=$3 pattern=$4 strangers
  [ -d "$dir" ] || return 0
  strangers=$( (cd "$dir" && find . -mindepth 1 -maxdepth "$depth" -type f -name "$pattern" -not -name .DS_Store -not -name '._*') \
    | sed 's|^\./||' | LC_ALL=C sort | LC_ALL=C comm -23 - "$work/$prefix.known" | tr '\n' ' ')
  [ -z "$strangers" ] || fail "$dir holds files that are not in $SUMS: $strangers"
}
failed_in() { sed -n 's/: FAILED.*$//p' "$1" | paste -sd ' ' -; }
refuse_altered() {
  local prefix=$1 dir=$2 altered
  [ -d "$dir" ] || return 0
  (cd "$dir" && while read -r sum name; do
    if [ -f "$name" ]; then printf '%s  %s\n' "$sum" "$name"; fi
  done < "$work/$prefix.sums") > "$work/present.sums"
  [ -s "$work/present.sums" ] || return 0
  (cd "$dir" && shasum -a 256 -c --quiet "$work/present.sums" > "$work/check" 2>&1) && return 0
  altered=$(failed_in "$work/check")
  [ -n "$altered" ] || { command cat "$work/check" >&2; fail "$dir: shasum failed"; }
  fail "$dir holds videos whose SHA-256 differ from $SUMS: $altered; delete them by hand if they are damaged copies, and run again"
}
fetch() {
  local prefix=$1 dir=$2 downloaded
  mkdir -p "$dir"
  rclone copy "$REMOTE/$prefix" "$dir" --files-from "$work/$prefix.known" --log-level INFO --log-file "$work/log" \
    || { command cat "$work/log" >&2; fail "rclone copy $REMOTE/$prefix failed"; }
  downloaded=$(grep -cE ': (Multi-thread )?Copied \(' "$work/log" || true)
  if ! (cd "$dir" && shasum -a 256 -c --quiet "$work/$prefix.sums" > "$work/check" 2>&1); then
    command cat "$work/check" >&2
    fail "$dir: SHA-256 differ from $SUMS for $(failed_in "$work/check"); delete them by hand and run again"
  fi
  echo "$prefix in $dir: $(wc -l < "$work/$prefix.known" | tr -d ' ') files, $downloaded downloaded, SHA-256 all equal"
  rm -f "$work/log"
}
sums_under reference-v0.1.1
sums_under img_0000
refuse_strangers reference-v0.1.1 "$BATDETECT_REFERENCE_DIR" 64 "*"
refuse_strangers img_0000 "$BATDETECT_VIDEOS_DIR" 1 "*.mp4"
refuse_altered img_0000 "$BATDETECT_VIDEOS_DIR"
fetch reference-v0.1.1 "$BATDETECT_REFERENCE_DIR"
fetch img_0000 "$BATDETECT_VIDEOS_DIR"
'''
