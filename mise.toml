[tools]
python = "3.14.8"
uv = "0.12.22"
lefthook = "2.1.16"
"github:taiki-e/cargo-llvm-cov" = "0.9.1"
cargo-deny = "0.20.2"
"github:Boshen/cargo-shear" = "1.14.0"

[tasks.lint]
run = "uv run ruff check"

[tasks.format]
run = "uv run ruff format"

[tasks."format:check"]
run = "uv run ruff format --check"

[tasks.typecheck]
run = "uv run basedpyright"

[tasks.test]
run = "uv run pytest"

[tasks.coverage]
run = "uv run pytest --cov=batdetect --cov-report=term-missing"

[tasks.static]
run = [
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run basedpyright",
]

[tasks."test:fast"]
run = "uv run pytest -n auto -m 'not slow and not reference' --cov=batdetect --cov-report=term-missing --cov-fail-under=95"

[tasks."test:slow"]
run = "uv run pytest -m slow"

[tasks.check]
run = [
  { task = "static" },
  { task = "test:fast" },
  { task = "test:slow" },
  { task = "rust:static" },
  { task = "rust:test" },
  { task = "rust:slow" },
]

[tasks."rust:ffmpeg"]
run = "bash packaging/ffmpeg-unix.sh"

[tasks."rust:link"]
run = "bash packaging/ffmpeg-unix.sh --link"

[tasks."rust:static"]
depends = ["rust:link"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  { task = "rust:rules" },
  "cargo deny check",
  "cargo shear --deny-warnings",
]

[tasks."rust:rules"]
run = '''
python3 -I - <<'EOF'
import glob
import re
import sys
import tomllib

failures = []
sources = {path: open(path, encoding="utf-8").read() for path in glob.glob("crates/**/*.rs", recursive=True)}
manifests = {path: tomllib.load(open(path, "rb")) for path in glob.glob("crates/*/Cargo.toml")}

def lines_matching(pattern, files, flags=0):
    return [f"{path}:{text.count(chr(10), 0, found.start()) + 1}" for path, text in files.items()
            for found in re.finditer(pattern, text, flags)]

attribute = r"#!?\[\s*(allow|expect)\b|cfg_attr\s*\((?:[^()]|\([^()]*\))*?\b(allow|expect)\b"
for found in lines_matching(attribute, sources):
    failures.append(f"C4 allow or expect attribute: {found}")

workspace = tomllib.load(open("Cargo.toml", "rb"))
expected = {table: dict(lints) for table, lints in workspace["workspace"]["lints"].items()}
expected["rust"].pop("unsafe_code", None)
for path, manifest in manifests.items():
    lints = manifest.get("lints")
    if path == "crates/media/Cargo.toml":
        if lints != expected:
            failures.append(f"C6 {path}: lints differ from the workspace table without unsafe_code")
    elif lints != {"workspace": True}:
        failures.append(f"C5 {path}: lints must be `workspace = true`")
    scopes = [manifest, *manifest.get("target", {}).values()]
    for scope, table in ((scope, table) for scope in scopes for table in ("dependencies", "dev-dependencies", "build-dependencies")):
        for name, spec in scope.get(table, {}).items():
            if not (isinstance(spec, dict) and spec.get("workspace") is True) or {"version", "path", "git"} & set(spec):
                failures.append(f"C8 {path}: {name} must come from the workspace")

outside_media = {path: text for path, text in sources.items() if not path.startswith("crates/media/")}
outside_media |= {path: open(path).read() for path in manifests if not path.startswith("crates/media/")}
for found in lines_matching(r"ffmpeg[_-](next|sys[_-]next)", outside_media):
    failures.append(f"C7 FFmpeg outside media: {found}")

if sum(text.count("catch_unwind") for text in sources.values()) > 1:
    failures.append("C9 more than one catch_unwind")
profiles = workspace.get("profile", {}).values()
if any(profile.get("panic") == "abort" for profile in profiles):
    failures.append("C9 a profile aborts on panic")

code = [line for text in sources.values() for line in text.splitlines() if line.strip()]
comments = [line for line in code if re.search(r"(?<![:\"])//|/\*(?!/)", line)]
if code and len(comments) > 0.02 * len(code):
    failures.append(f"C10 {len(comments)} comment lines out of {len(code)}, above 2 %")

for found in lines_matching(r"round_ties_even|opencv|numpy|python|pairwise", sources, re.IGNORECASE):
    failures.append(f"C11 imitation: {found}")

for failure in failures:
    print(failure, file=sys.stderr)
sys.exit(1 if failures else 0)
EOF
'''

[tasks."rust:test"]
depends = ["rust:link"]
run = "cargo llvm-cov --profile ci --workspace --locked --fail-under-lines 95"

[tasks."rust:slow"]
depends = ["rust:link"]
run = "cargo test --workspace --locked --profile ci --test 'slow_*' -- --include-ignored"

[tasks."rust:reference"]
depends = ["rust:link"]
run = "cargo test --workspace --locked --profile ci --test 'reference_*' -- --include-ignored"

[tasks.catalog]
run = "uv run python -m batdetect.pofile src/batdetect/locale"

[tasks.package]
run = '''
set -euo pipefail
rm -rf build/pyinstaller dist/batdetect dist/batdetect-darwin-arm64.tar.gz
uv run python -m batdetect.pofile src/batdetect/locale
uv run --group release pyinstaller --noconfirm --clean --onedir --noupx --name batdetect \
  --copy-metadata batdetect --copy-metadata opencv-python-headless \
  --add-data "$PWD/src/batdetect/locale/fr/LC_MESSAGES/messages.mo:batdetect/locale/fr/LC_MESSAGES" \
  --distpath dist --workpath build/pyinstaller --specpath build/pyinstaller src/batdetect/cli.py
cv2_dir=$(uv run python -c "import cv2, pathlib; print(pathlib.Path(cv2.__file__).parent)")
python_license=$(uv run python -c "import sysconfig; print(sysconfig.get_path('stdlib'))")/LICENSE.txt
cp LICENSE packaging/NOTICE packaging/GPL-3.0.txt "$cv2_dir/LICENSE-3RD-PARTY.txt" dist/batdetect/
cp "$python_license" dist/batdetect/LICENSE-PYTHON.txt
COPYFILE_DISABLE=1 tar -czf dist/batdetect-darwin-arm64.tar.gz -C dist batdetect
'''

[tasks."package:check"]
env = { MACOS_MIN = "14.0", EXTRACT = "tests/fixtures/video_092_original_3m24-4m05.mp4", CHECK_DIR = "out/package-check" }
run = '''
set -euo pipefail
binary=dist/batdetect/batdetect
minos=$(find dist/batdetect -type f -exec otool -l {} + 2>/dev/null | awk '$1 == "minos" { print $2 }' | sort -V | tail -1)
if [ -z "$minos" ] || [ "$(printf '%s\n' "$minos" "$MACOS_MIN" | sort -V | tail -1)" != "$MACOS_MIN" ]; then
  echo "binary needs macOS $minos, the formula promises $MACOS_MIN" >&2
  exit 1
fi
ffmpeg_prefix=$(grep -o '/opt/homebrew/Cellar/ffmpeg/[^)]*' packaging/NOTICE)
if ! strings dist/batdetect/_internal/libavcodec.*.dylib | grep -- "--prefix=$ffmpeg_prefix " > /dev/null; then
  echo "bundled FFmpeg is not $ffmpeg_prefix named in packaging/NOTICE" >&2
  exit 1
fi
unlisted=$(find dist/batdetect -name '*.dylib' -exec basename {} \; | while read -r lib; do
  grep -q "^$lib:" packaging/NOTICE || echo "$lib"
done)
if [ -n "$unlisted" ]; then
  echo "libraries missing from packaging/NOTICE: $unlisted" >&2
  exit 1
fi
french_help=$(env -u LC_ALL -u LC_MESSAGES -u LANGUAGE LANG=fr_FR.UTF-8 "$binary" --help)
case "$french_help" in
  "utilisation : batdetect"*"affiche ce message d'aide et quitte"*) ;;
  *) echo "binary help is not in French under LANG=fr_FR.UTF-8" >&2; exit 1 ;;
esac
english_help=$(env -u LC_ALL -u LC_MESSAGES -u LANGUAGE -u LANG "$binary" --help)
case "$english_help" in
  "usage: batdetect"*) ;;
  *) echo "binary help is not in English without a locale" >&2; exit 1 ;;
esac
rm -rf "$CHECK_DIR"
uv run batdetect "$EXTRACT" -o "$CHECK_DIR/source"
"$binary" "$EXTRACT" -o "$CHECK_DIR/binary"
"$binary" "$EXTRACT" -o "$CHECK_DIR/binary-workers" --workers 2
for run in binary binary-workers; do
  cmp "$CHECK_DIR"/source/*/*.csv "$CHECK_DIR/$run"/*/*.csv
done
'''
