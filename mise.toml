[tools]
python = "3.14.8"
uv = "0.12.22"
lefthook = "2.1.16"

[tasks.lint]
run = "uv run ruff check"

[tasks.format]
run = "uv run ruff format"

[tasks."format:check"]
run = "uv run ruff format --check"

[tasks.typecheck]
run = "uv run basedpyright"

[tasks.test]
run = "uv run pytest"

[tasks.coverage]
run = "uv run pytest --cov=batdetect --cov-report=term-missing"

[tasks.check]
run = [
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run basedpyright",
  "uv run pytest",
]
