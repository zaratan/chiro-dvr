[project]
name = "batdetect"
version = "0.1.0"
description = "Détection et suivi de chauves-souris dans des vidéos de jumelles thermiques"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
]

[project.scripts]
batdetect = "batdetect.cli:main"
batdetect-bench = "batdetect.bench.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
]
release = [
    "pyinstaller>=6.22.3",
]

[tool.uv]
python-preference = "only-system"
python-downloads = "never"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "N", "PTH", "PL", "NPY", "PT", "S"]
ignore = ["S301", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "-m", "not reference"]
markers = [
    "slow: runs the detector on the real fixture video",
    "reference: runs the detector on the whole 092 video, stored with Git LFS",
]
