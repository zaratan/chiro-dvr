name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash packaging/release-guards.sh "$GITHUB_REF_NAME"
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  package:
    needs: guard
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.guard.outputs.version }}
      fresh: true

  publish:
    needs: package
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            packaging/release-notes.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - run: packaging/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Publish the release once every file is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null || echo absent)
          case $draft in
            absent)
              gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
                --title "$GITHUB_REF_NAME" --notes-file release-notes.md dist/*
              ;;
            true)
              gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
              ;;
            *)
              echo "::error::$GITHUB_REF_NAME is already published"
              exit 1
              ;;
          esac
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
