name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --commit "$(git rev-parse HEAD)" --status success --json databaseId --jq length)
          if [ "$passed" = 0 ]; then
            echo "::error::CI has not passed on main for $(git rev-parse HEAD) yet: rerun once it has"
            exit 1
          fi
      - uses: ./.github/actions/setup
      - name: CHANGELOG.md has a section for the tag
        run: packaging/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null
      - name: Tag matches pyproject.toml
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but pyproject.toml says $version"
            exit 1
          fi
      - run: git lfs pull --include=tests/fixtures/video_092_original_3m24-4m05.mp4
      - run: brew install ffmpeg
      - run: mise run package
      - name: Binary reports the tag version
        run: test "$(dist/batdetect/batdetect --version)" = "batdetect ${GITHUB_REF_NAME#v}"
      - run: mise run package:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: batdetect-darwin-arm64
          path: dist/batdetect-darwin-arm64.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            CHANGELOG.md
            packaging/release-notes.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: batdetect-darwin-arm64
          path: dist
      - run: packaging/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
      - run: cd dist && sha256sum batdetect-darwin-arm64.tar.gz > SHA256SUMS
      - name: Publish the release once every file is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md \
            dist/batdetect-darwin-arm64.tar.gz dist/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
