name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  refuse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Nothing is published before #93
        run: |
          echo "::error::publication impossible avant #93"
          exit 1
