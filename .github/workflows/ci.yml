name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: ffmpeg-key
        uses: ./.github/actions/ffmpeg-key
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.ffmpeg-key.outputs.target-key }}
          restore-keys: ${{ steps.ffmpeg-key.outputs.target-restore-key }}
      - id: ffmpeg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - run: mise run rust:ffmpeg
      - if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - run: mise run rust:static
      - run: mise run rust:coverage

  rust-slow:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      EXTRACT: tests/fixtures/video_092_original_3m24-4m05.mp4
      SMALL: tests/fixtures/video_092_original_3m24-4m05_720x540.mp4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git lfs ls-files --long --include="$EXTRACT,$SMALL" | cut -d ' ' -f 1 > .lfs-assets-id
      - id: lfs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-extract-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull --include="$EXTRACT,$SMALL"
      - if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-extract-${{ hashFiles('.lfs-assets-id') }}
      - uses: ./.github/actions/setup
      - id: ffmpeg-key
        uses: ./.github/actions/ffmpeg-key
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.ffmpeg-key.outputs.target-key }}
          restore-keys: ${{ steps.ffmpeg-key.outputs.target-restore-key }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - run: mise run rust:ffmpeg
      - run: mise run rust:slow
      - run: cargo build --locked --profile ci --workspace --bin batdetect
      - if: runner.os == 'macOS'
        run: |
          otool -L target/ci/batdetect
          if otool -L target/ci/batdetect | grep -E 'libav|libsw|openh264'; then exit 1; fi
          minos=$(vtool -show-build target/ci/batdetect | awk '$1 == "minos" { print $2 }')
          [ -n "$minos" ] && [ "$(printf '%s\n' "$minos" 14.0 | sort -V | tail -1)" = 14.0 ] || { echo "binary needs macOS $minos" >&2; exit 1; }
      - if: runner.os == 'Linux'
        run: |
          ldd target/ci/batdetect
          if ldd target/ci/batdetect | grep -E 'libav|libsw|openh264'; then exit 1; fi
      - if: runner.os == 'macOS'
        run: cargo test --workspace --locked --profile ci --test 'hardware_*' -- --include-ignored

  rust-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git lfs ls-files --long | cut -d ' ' -f 1 | sort > .lfs-assets-id
      - id: lfs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-all-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-all-${{ hashFiles('.lfs-assets-id') }}
      - uses: ./.github/actions/setup
      - id: ffmpeg-key
        uses: ./.github/actions/ffmpeg-key
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.ffmpeg-key.outputs.target-key }}
          restore-keys: ${{ steps.ffmpeg-key.outputs.target-restore-key }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - run: mise run rust:ffmpeg
      - run: mise run rust:reference

  rust-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXTRACT: tests/fixtures/video_092_original_3m24-4m05.mp4
      SMALL: tests/fixtures/video_092_original_3m24-4m05_720x540.mp4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git lfs ls-files --long --include="$EXTRACT,$SMALL" | cut -d ' ' -f 1 > .lfs-assets-id
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-extract-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull --include="$EXTRACT,$SMALL"
      - uses: ./.github/actions/setup
      - id: ffmpeg-key
        uses: ./.github/actions/ffmpeg-key
        with:
          job: rust-reference
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.ffmpeg-key.outputs.target-key }}
          restore-keys: ${{ steps.ffmpeg-key.outputs.target-restore-key }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - run: mise run rust:ffmpeg
      - run: mise run rust:settings

  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VCPKGRS_DISABLE: 1
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows
      - id: ffmpeg-key
        uses: ./.github/actions/ffmpeg-key
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.ffmpeg-key.outputs.target-key }}
          restore-keys: ${{ steps.ffmpeg-key.outputs.target-restore-key }}
      - id: ffmpeg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.XDG_CACHE_HOME }}/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - shell: msys2 {0}
        run: bash packaging/ffmpeg-windows.sh
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-windows-logs
          path: ${{ env.XDG_CACHE_HOME }}/batdetect/ffmpeg/logs
          if-no-files-found: ignore
      - if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.XDG_CACHE_HOME }}/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - shell: msys2 {0}
        run: cargo test --workspace --locked --profile ci --no-fail-fast
      - shell: msys2 {0}
        run: |
          cargo build --locked --profile ci --workspace --bin batdetect
          dumpbin -nologo -dependents target/ci/batdetect.exe | tee target/dependents.txt
          dlls=$(grep -Eio '[^[:space:]]+\.dll' target/dependents.txt | tr '[:upper:]' '[:lower:]' | sort -u)
          grep -qx 'kernel32\.dll' <<< "$dlls"
          unexpected=$(grep -Evx 'kernel32\.dll|ntdll\.dll|bcrypt\.dll|bcryptprimitives\.dll|api-ms-win-core-[a-z0-9-]+\.dll' <<< "$dlls" || true)
          if [ -n "$unexpected" ]; then
            echo "batdetect.exe needs DLLs outside Windows itself: $unexpected" >&2
            exit 1
          fi
      - shell: msys2 {0}
        run: cargo clippy --workspace --all-targets --locked --profile ci -- -D warnings

  rust-windows-slow:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      EXTRACT: tests/fixtures/video_092_original_3m24-4m05.mp4
      VCPKGRS_DISABLE: 1
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git lfs ls-files --long --include="$EXTRACT" | cut -d ' ' -f 1 > .lfs-assets-id
      - id: lfs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-extract-${{ hashFiles('.lfs-assets-id') }}
          enableCrossOsArchive: true
      - run: git lfs pull --include="$EXTRACT"
      - if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-extract-${{ hashFiles('.lfs-assets-id') }}
          enableCrossOsArchive: true
      - uses: ./.github/actions/windows
      - id: ffmpeg-key
        uses: ./.github/actions/ffmpeg-key
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.ffmpeg-key.outputs.target-key }}
          restore-keys: ${{ steps.ffmpeg-key.outputs.target-restore-key }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.XDG_CACHE_HOME }}/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - shell: msys2 {0}
        run: bash packaging/ffmpeg-windows.sh
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-windows-slow-logs
          path: ${{ env.XDG_CACHE_HOME }}/batdetect/ffmpeg/logs
          if-no-files-found: ignore
      - shell: msys2 {0}
        run: cargo test --workspace --locked --profile ci --no-fail-fast --test 'slow_*' -- --include-ignored
