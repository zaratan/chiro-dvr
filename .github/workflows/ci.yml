name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
            printf '%s\n' "$changed"
            if [ -n "$changed" ] && ! grep -qvE '(\.md$|^docs/images/)' <<< "$changed"; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: ffmpeg-key
        uses: ./.github/actions/ffmpeg-key
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.ffmpeg-key.outputs.target-key }}
          restore-keys: ${{ steps.ffmpeg-key.outputs.target-restore-key }}
      - id: ffmpeg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - run: mise run rust:ffmpeg
      - if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - run: mise run rust:static
      - run: mise run rust:coverage

  rust-slow:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      EXTRACT: tests/fixtures/video_092_original_3m24-4m05.mp4
      SMALL: tests/fixtures/video_092_original_3m24-4m05_720x540.mp4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git lfs ls-files --long --include="$EXTRACT,$SMALL" | cut -d ' ' -f 1 > .lfs-assets-id
      - id: lfs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-extract-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull --include="$EXTRACT,$SMALL"
      - if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-extract-${{ hashFiles('.lfs-assets-id') }}
      - uses: ./.github/actions/setup
      - id: ffmpeg-key
        uses: ./.github/actions/ffmpeg-key
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.ffmpeg-key.outputs.target-key }}
          restore-keys: ${{ steps.ffmpeg-key.outputs.target-restore-key }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - run: mise run rust:ffmpeg
      - run: mise run rust:slow
      - if: runner.os == 'macOS'
        run: cargo test --workspace --locked --profile ci --test 'hardware_*' -- --include-ignored

  rust-reference:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git lfs ls-files --long | cut -d ' ' -f 1 | sort > .lfs-assets-id
      - id: lfs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-all-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-all-${{ hashFiles('.lfs-assets-id') }}
      - uses: ./.github/actions/setup
      - id: ffmpeg-key
        uses: ./.github/actions/ffmpeg-key
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.ffmpeg-key.outputs.target-key }}
          restore-keys: ${{ steps.ffmpeg-key.outputs.target-restore-key }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - run: mise run rust:ffmpeg
      - run: mise run rust:reference

  rust-settings:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      EXTRACT: tests/fixtures/video_092_original_3m24-4m05.mp4
      SMALL: tests/fixtures/video_092_original_3m24-4m05_720x540.mp4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git lfs ls-files --long --include="$EXTRACT,$SMALL" | cut -d ' ' -f 1 > .lfs-assets-id
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-extract-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull --include="$EXTRACT,$SMALL"
      - uses: ./.github/actions/setup
      - id: ffmpeg-key
        uses: ./.github/actions/ffmpeg-key
        with:
          job: rust-reference
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.ffmpeg-key.outputs.target-key }}
          restore-keys: ${{ steps.ffmpeg-key.outputs.target-restore-key }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - run: mise run rust:ffmpeg
      - run: mise run rust:settings

  rust-windows:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VCPKGRS_DISABLE: 1
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows
      - id: ffmpeg-key
        uses: ./.github/actions/ffmpeg-key
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.ffmpeg-key.outputs.target-key }}
          restore-keys: ${{ steps.ffmpeg-key.outputs.target-restore-key }}
      - id: ffmpeg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.XDG_CACHE_HOME }}/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - shell: msys2 {0}
        run: bash packaging/ffmpeg-windows.sh
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-windows-logs
          path: ${{ env.XDG_CACHE_HOME }}/batdetect/ffmpeg/logs
          if-no-files-found: ignore
      - if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.XDG_CACHE_HOME }}/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - shell: msys2 {0}
        run: cargo test --workspace --locked --profile ci --no-fail-fast
      - shell: msys2 {0}
        run: cargo clippy --workspace --all-targets --locked --profile ci -- -D warnings

  rust-windows-slow:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      EXTRACT: tests/fixtures/video_092_original_3m24-4m05.mp4
      VCPKGRS_DISABLE: 1
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git lfs ls-files --long --include="$EXTRACT" | cut -d ' ' -f 1 > .lfs-assets-id
      - id: lfs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-extract-${{ hashFiles('.lfs-assets-id') }}
          enableCrossOsArchive: true
      - run: git lfs pull --include="$EXTRACT"
      - if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-extract-${{ hashFiles('.lfs-assets-id') }}
          enableCrossOsArchive: true
      - uses: ./.github/actions/windows
      - id: ffmpeg-key
        uses: ./.github/actions/ffmpeg-key
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.ffmpeg-key.outputs.target-key }}
          restore-keys: ${{ steps.ffmpeg-key.outputs.target-restore-key }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.XDG_CACHE_HOME }}/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - shell: msys2 {0}
        run: bash packaging/ffmpeg-windows.sh
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-windows-slow-logs
          path: ${{ env.XDG_CACHE_HOME }}/batdetect/ffmpeg/logs
          if-no-files-found: ignore
      - shell: msys2 {0}
        run: cargo test --workspace --locked --profile ci --no-fail-fast --test 'slow_*' -- --include-ignored

  package:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    uses: ./.github/workflows/package.yml

  verdict:
    needs: [changes, rust, rust-slow, rust-reference, rust-settings, rust-windows, rust-windows-slow, package]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null
