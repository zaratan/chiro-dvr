name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: mise run static
      - run: uv cache prune --ci

  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          ffmpeg: true
      - run: mise run test:fast -- --cov-report="markdown-append:$GITHUB_STEP_SUMMARY"
      - run: uv cache prune --ci

  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXTRACT: tests/fixtures/video_092_original_3m24-4m05.mp4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git lfs ls-files --long --include="$EXTRACT" | cut -d ' ' -f 1 > .lfs-assets-id
      - id: lfs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-extract-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull --include="$EXTRACT"
      - if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-extract-${{ hashFiles('.lfs-assets-id') }}
      - uses: ./.github/actions/setup
        with:
          ffmpeg: true
      - run: mise run test:slow
      - run: uv cache prune --ci

  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git lfs ls-files --long | cut -d ' ' -f 1 | sort > .lfs-assets-id
      - id: lfs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-all-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-all-${{ hashFiles('.lfs-assets-id') }}
      - uses: ./.github/actions/setup
        with:
          ffmpeg: true
      - run: uv run pytest -m reference
      - run: uv cache prune --ci

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      EXTRACT: tests/fixtures/video_092_original_3m24-4m05.mp4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git lfs ls-files --long --include="$EXTRACT" | cut -d ' ' -f 1 > .lfs-assets-id
      - id: lfs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-extract-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull --include="$EXTRACT"
      - if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-extract-${{ hashFiles('.lfs-assets-id') }}
      - uses: ./.github/actions/setup
        with:
          rust: true
      - id: ffmpeg-key
        run: |
          echo "XDG_CACHE_HOME=$HOME/.cache" >> "$GITHUB_ENV"
          echo "key=ffmpeg-${ImageOS:-$RUNNER_OS}-$RUNNER_ARCH-$(bash packaging/ffmpeg-unix.sh --fingerprint)" >> "$GITHUB_OUTPUT"
      - id: ffmpeg-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - run: mise run rust:ffmpeg
      - if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - run: mise run rust:static
      - run: mise run rust:test
      - run: mise run rust:slow
      - run: cargo build --locked --profile ci -p batdetect
      - if: runner.os == 'macOS'
        run: |
          otool -L target/ci/batdetect-rs
          if otool -L target/ci/batdetect-rs | grep -E 'libav|libsw|openh264'; then exit 1; fi
          minos=$(vtool -show-build target/ci/batdetect-rs | awk '$1 == "minos" { print $2 }')
          [ -n "$minos" ] && [ "$(printf '%s\n' "$minos" 14.0 | sort -V | tail -1)" = 14.0 ] || { echo "binary needs macOS $minos" >&2; exit 1; }
      - if: runner.os == 'Linux'
        run: |
          ldd target/ci/batdetect-rs
          if ldd target/ci/batdetect-rs | grep -E 'libav|libsw|openh264'; then exit 1; fi
      - if: runner.os == 'macOS'
        run: cargo test -p media --locked --profile ci --test 'hardware_*' -- --include-ignored

  rust-reference:
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git lfs ls-files --long | cut -d ' ' -f 1 | sort > .lfs-assets-id
      - id: lfs-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-all-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-all-${{ hashFiles('.lfs-assets-id') }}
      - uses: ./.github/actions/setup
        with:
          rust: true
      - id: ffmpeg-key
        run: |
          echo "XDG_CACHE_HOME=$HOME/.cache" >> "$GITHUB_ENV"
          echo "key=ffmpeg-${ImageOS:-$RUNNER_OS}-$RUNNER_ARCH-$(bash packaging/ffmpeg-unix.sh --fingerprint)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/batdetect/ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - run: mise run rust:ffmpeg
      - run: mise run rust:reference
