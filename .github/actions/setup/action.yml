name: Setup
description: The Rust toolchain of rust-toolchain.toml, and the cargo tools and Python of mise.toml.

runs:
  using: composite
  steps:
    - shell: bash
      run: echo "MISE_AUTO_INSTALL=false" >> "$GITHUB_ENV"
    - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        install_args: python github:taiki-e/cargo-llvm-cov cargo-deny github:Boshen/cargo-shear
        cache_key_prefix: mise-rust-v1
    - shell: bash
      run: rustup toolchain install && cargo --version
