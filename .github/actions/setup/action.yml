name: Setup
description: Tools from mise.toml, Python dependencies from uv.lock, and ffmpeg when asked.

inputs:
  ffmpeg:
    description: Install ffmpeg and ffprobe from the runner's apt packages.
    default: "false"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
    - if: inputs.ffmpeg == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ffmpeg
    - shell: bash
      run: uv sync --locked
