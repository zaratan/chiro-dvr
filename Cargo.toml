[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", features = ["string", "wrap_help"] }
ctrlc = "3.5.2"
dhat = "0.3.3"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
flate2 = "1.1.10"
fluent-bundle = "0.16.0"
jiff = "0.2.38"
png = "0.18.1"
proptest = "1.11.0"
rayon = "1.12.0"
skrifa = "0.48.0"
sys-locale = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
unic-langid = "0.9.6"
unicode-normalization = "0.1.25"
draw = { path = "crates/draw" }
bench = { path = "crates/bench" }
compare = { path = "crates/compare" }
engine = { path = "crates/engine" }
files = { path = "crates/files" }
media = { path = "crates/media" }
page = { path = "crates/page" }
reference = { path = "crates/reference" }
render = { path = "crates/render" }
summary = { path = "crates/summary" }
tracking = { path = "crates/tracking" }
types = { path = "crates/types" }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
non_ascii_idents = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
allow_attributes = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
iter_over_hash_type = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
mod_module_files = "warn"
multiple_unsafe_ops_per_block = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
string_slice = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
overflow-checks = true
debug-assertions = true
